[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-comparison-engine"
version = "0.5.1"
description = "Generic regression comparison, paired inference, residual diagnostics and interactive reports"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.2", "matplotlib>=3.7", "pyarrow>=12", "scipy>=1.15"]

[project.optional-dependencies]
notebook = ["ipywidgets>=8", "ipython>=8", "jupyterlab>=4", "nbformat>=5.9", "nbclient>=0.10"]
training = ["scikit-learn>=1.2"]
explain = ["shap>=0.47"]
interactive = ["plotly>=5.18"]

[project.scripts]
model-comparison = "model_comparison_engine.cli:main"

[tool.setuptools.packages.find]
include = ["model_comparison_engine*"]
